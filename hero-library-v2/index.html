<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Hero Library | VEXTER3 Guide</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#172235;--line:#304158;--text:#f1f5fa;--muted:#b6c3d3;--gold:#e7bf78;--accent:#84c6d4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#24364a 0,transparent 35%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--accent)}header,.shell{max-width:1250px;margin:auto;padding:20px 22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.09em;color:var(--gold);text-decoration:none}.crumb{color:var(--muted);font-size:14px}.intro{padding:30px 0 20px}.intro h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:0 0 10px}.intro p{color:var(--muted);max-width:720px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 12px}input,select{background:#152237;color:var(--text);border:1px solid #4c5f75;border-radius:9px;padding:13px 14px;font:inherit}input{flex:1;min-width:210px}select{min-width:160px}#count{color:var(--muted);font-size:14px;margin:10px 0 20px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:17px}.hero{border:1px solid var(--line);background:var(--panel);border-radius:13px;overflow:hidden;text-align:left;padding:0;color:inherit;cursor:pointer;transition:transform .18s,border-color .18s;display:block;width:100%}.hero:hover,.hero:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}.hero img{width:100%;height:245px;object-fit:contain;object-position:center bottom;background:linear-gradient(145deg,#29374b,#101a2b);display:block}.hero .meta{padding:13px}.hero strong{display:block;font-size:17px}.hero small{color:var(--muted)}.tag{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.overlay{position:fixed;inset:0;background:#03070dcc;z-index:10;display:none;overflow:auto;padding:22px}.overlay.open{display:block}.detail{max-width:900px;margin:20px auto;background:#142035;border:1px solid var(--line);border-radius:15px;overflow:hidden}.detailhead{display:flex;justify-content:flex-end;padding:10px}.close{font:inherit;background:#2d4058;color:white;border:1px solid #56677c;border-radius:8px;padding:8px 16px;cursor:pointer}.detailbody{padding:0 25px 30px}.detailbody img{max-width:240px;max-height:310px;width:100%;object-fit:contain;float:right;margin:0 0 20px 24px;background:#223147;border-radius:10px}.detailbody h1{color:var(--gold);line-height:1.2}.detailbody h2{font-size:20px;color:var(--gold);border-top:1px solid var(--line);padding-top:17px;margin-top:25px}.detailbody p{white-space:normal}.detailbody li{margin:6px 0}.detailbody table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}.detailbody th,.detailbody td{padding:9px;border:1px solid var(--line);text-align:left}.detailbody th{background:#26364a}.detailbody ol,.detailbody ul{padding-left:24px}.detailbody{overflow-wrap:anywhere}.hero img{object-position:center center}.hero img,.detailbody img{max-width:100%}.hero small{display:block}.detailbody{min-width:0}.detailbody table{max-width:100%}.detailbody th,.detailbody td{vertical-align:top}.hero:focus-visible,.close:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.detailbody a{overflow-wrap:anywhere}.empty{padding:50px 0;color:var(--muted)}footer{max-width:1250px;margin:50px auto 0;padding:20px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}@media(max-width:520px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.hero img{height:205px}.detailbody img{float:none;display:block;margin:0 auto 16px}.detailbody{padding:0 17px 24px}header{flex-wrap:wrap}.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.controls input{grid-column:1/-1;min-width:0}.controls select{min-width:0;width:100%}.overlay{padding:8px}.detail{margin:8px auto}.detailbody table{display:block;overflow-x:auto;max-width:100%}.detailbody th,.detailbody td{min-width:85px}.hero img{height:190px}.hero .meta{padding:10px}.hero strong{font-size:15px}.tag{font-size:11px}}@media(max-width:360px){.gallery{gap:8px}.hero img{height:165px}.hero .meta{padding:8px}.hero strong{font-size:14px}}
</style><script>try{document.documentElement.lang=localStorage.getItem('vxtr-language')==='fr'?'fr':'en'}catch(e){}</script><style>.lang-switch{display:flex;gap:5px}.lang-switch button{background:#23354b;color:#f1f5fa;border:1px solid #61718a;padding:7px 11px;border-radius:7px;cursor:pointer}.lang-switch button[aria-pressed="true"]{border-color:#e7bf78;color:#e7bf78}</style></head><body><header><a class="brand" href="../index.html">VEXTER3 GUIDE</a><span class="crumb" data-en="Hero Library · Approved profiles" data-fr="Bibliothèque des héros · Profils approuvés">Hero Library · Approved profiles</span><nav class="lang-switch" aria-label="Language"><button type="button" data-set-language="en">EN</button><button type="button" data-set-language="fr">FR</button></nav></header>
<main class="shell"><section class="intro"><h1 data-en="Hero Library" data-fr="Bibliothèque des héros">Hero Library</h1><p>Explore all 27 approved hero profiles. Original portraits are shown without cropping. Profile details are currently written in English.</p></section>
<div class="controls"><input id="search" type="search" placeholder="Search heroes…" aria-label="Search heroes"><select id="faction" aria-label="Filter by faction"><option value="" data-en="All factions" data-fr="Toutes les factions">All factions</option><option value="Warrior" data-en="Warrior" data-fr="Guerrier">Warrior</option><option value="Ranger" data-en="Ranger" data-fr="Rôdeur">Ranger</option><option value="Warlock" data-en="Warlock" data-fr="Sorcier">Warlock</option></select><select id="rarity" aria-label="Filter by rarity"><option value="" data-en="All rarities" data-fr="Toutes les raretés">All rarities</option><option>UR</option><option>SSR</option></select></div><div id="count" aria-live="polite"></div><section class="gallery" id="gallery" aria-label="Heroes"></section><p id="empty" class="empty" hidden data-en="No heroes match those filters." data-fr="Aucun héros ne correspond à ces filtres.">No heroes match those filters.</p></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Hero details"><article class="detail"><div class="detailhead"><button class="close" id="close" data-en="Close ✕" data-fr="Fermer ✕">Close ✕</button></div><div class="detailbody" id="detail"></div></article></div><footer>Hero Library V2 · Approved portraits · Bilingual profiles</footer>
<script>
const heroes=[{"name":"Arthur","slug":"arthur","img":"portrait-approvals/IMG_1286.jpeg"},{"name":"Marlena","slug":"marlena","img":"../IMG_1287.jpeg"},{"name":"Daskal","slug":"daskal","img":"../IMG_1289.jpeg"},{"name":"Zoya","slug":"zoya","img":"../IMG_1290.jpeg"},{"name":"Harper","slug":"harper","img":"../IMG_1291.jpeg"},{"name":"Shadow","slug":"shadow","img":"../IMG_1292.jpeg"},{"name":"Cynthia","slug":"cynthia","img":"../IMG_1293.jpeg"},{"name":"Louis","slug":"louis","img":"../IMG_1294.jpeg"},{"name":"Bell","slug":"bell","img":"../IMG_1295.jpeg"},{"name":"Red Lady","slug":"red-lady","img":"../IMG_1296.jpeg"},{"name":"Claire","slug":"claire","img":"../IMG_1297.jpeg"},{"name":"Ulfrid","slug":"ulfrid","img":"../IMG_1298.jpeg"},{"name":"Annie","slug":"annie","img":"../IMG_1299.jpeg"},{"name":"Billy","slug":"billy","img":"../IMG_1300.jpeg"},{"name":"Nicole","slug":"nicole","img":"../IMG_1301.jpeg"},{"name":"Joker","slug":"joker","img":"../IMG_1302.jpeg"},{"name":"Bella","slug":"bella","img":"../IMG_1303.jpeg"},{"name":"Lucius","slug":"lucius","img":"../IMG_1304.jpeg"},{"name":"Celia","slug":"celia","img":"../IMG_1305.jpeg"},{"name":"Ash","slug":"ash","img":"../IMG_1306.jpeg"},{"name":"Sivir","slug":"sivir","img":"../IMG_1307.jpeg"},{"name":"Griffith","slug":"griffith","img":"../IMG_1308.jpeg"},{"name":"Hastar","slug":"hastar","img":"../IMG_1309.jpeg"},{"name":"Stellar","slug":"stellar","img":"../IMG_1310.jpeg"},{"name":"Grenwald","slug":"grenwald","img":"../IMG_1311.jpeg"},{"name":"Kesso","slug":"kesso","img":"../IMG_1313.jpeg"},{"name":"Bestar","slug":"bestar","img":"../IMG_1314.jpeg"}];
const $=s=>document.querySelector(s);let lastFocus=null,currentHeroSlug=null;const isFr=()=>document.documentElement.lang==='fr';const localizedFaction=f=>isFr()?({Warrior:'Guerrier',Ranger:'Rôdeur',Warlock:'Sorcier'}[f]||f):f;const localizedRole=r=>isFr()?r.replace('Support','Soutien').replace('Healer','Soigneur').replace('ATK buffer','bonus d’ATQ'):r;const urHeroes=new Set(['arthur','marlena','daskal','zoya','harper','shadow','cynthia','louis','bell','red-lady']);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function inline(s){return escapeHtml(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>'<a href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');}
function markdown(md){
 const lines=md.split(/\r?\n/),out=[];let list='',table=false,paragraph=[];
 const flushParagraph=()=>{if(paragraph.length){out.push('<p>'+paragraph.map(inline).join(' ')+'</p>');paragraph=[];}};
 const closeList=()=>{if(list){out.push('</'+list+'>');list='';}};
 const closeTable=()=>{if(table){out.push('</tbody></table>');table=false;}};
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();
  if(!line){flushParagraph();closeList();closeTable();continue;}
  const heading=line.match(/^(#{1,4})\s+(.+)$/);
  if(heading){flushParagraph();closeList();closeTable();out.push('<h'+heading[1].length+'>'+inline(heading[2])+'</h'+heading[1].length+'>');continue;}
  if(/^\|.*\|$/.test(line)&&i+1<lines.length&&/^\|[\s:|\-]+\|$/.test(lines[i+1].trim())){
   flushParagraph();closeList();closeTable();const cells=line.slice(1,-1).split('|').map(c=>'<th>'+inline(c.trim())+'</th>').join('');
   out.push('<table><thead><tr>'+cells+'</tr></thead><tbody>');table=true;i++;continue;
  }
  if(table&&/^\|.*\|$/.test(line)){out.push('<tr>'+line.slice(1,-1).split('|').map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>');continue;}
  closeTable();
  const unordered=line.match(/^[-*]\s+(.+)$/),ordered=line.match(/^\d+\.\s+(.+)$/);
  if(unordered||ordered){flushParagraph();const kind=ordered?'ol':'ul';if(list!==kind){closeList();out.push('<'+kind+'>');list=kind;}out.push('<li>'+inline((ordered||unordered)[1])+'</li>');continue;}
  closeList();paragraph.push(line);
 }
 flushParagraph();closeList();closeTable();return out.join('');
}
function publicProfile(md){const lines=md.split(/\r?\n/);const out=[];let hidden=false;for(const line of lines){const heading=line.match(/^#{2,6}\s+(.+)$/);if(heading){const title=heading[1].replace(/\*\*/g,'').trim().toLowerCase();hidden=/^(approval provenance|portrait asset reference|approval history|internal notes|review notes|source notes)$/.test(title);}if(hidden)continue;if(/^\s*\*\*(?:status|portrait|approval status|review status|source screenshots|screenshot reference|asset location|original uploaded jpeg):\*\*/i.test(line))continue;if(/^\s*(?:status|portrait):\s*(?:approved|user-supplied original portrait)/i.test(line))continue;out.push(line);}return out.join('\n').trim();}
function parseMeta(md,key){const match=md.match(new RegExp('\\*\\*'+key+':\\*\\*\\s*([^\\n]+)','i'));return match?match[1].replace(/\*\*/g,'').trim():'';}
async function loadFrench(hero){if(hero.textFr!==undefined)return;try{const res=await fetch('profiles-fr/'+hero.slug+'.md');if(!res.ok)throw Error('HTTP '+res.status);hero.textFr=await res.text()}catch(e){hero.textFr='';hero.errorFr='Profil français indisponible : '+e.message;}}
async function load(hero){if(hero.text!==undefined)return;try{const res=await fetch('profiles/'+hero.slug+'.md');if(!res.ok)throw Error('HTTP '+res.status);hero.text=await res.text();hero.faction=parseMeta(hero.text,'Faction');hero.rarity=parseMeta(hero.text,'Rarity')||(/— UR\b/.test(hero.text.split('\n')[0])?'UR':/— SSR\b/.test(hero.text.split('\n')[0])?'SSR':urHeroes.has(hero.slug)?'UR':'');hero.role=parseMeta(hero.text,'Role');}catch(e){hero.text='';hero.error='Profile could not be loaded: '+e.message;}}
function render(){const q=$('#search').value.toLowerCase().trim(),f=$('#faction').value,r=$('#rarity').value;const filtered=heroes.filter(h=>(!q||[h.name,h.faction,h.rarity,h.role].join(' ').toLowerCase().includes(q))&&(!f||(h.faction||'').toLowerCase()===f.toLowerCase())&&(!r||h.rarity===r));$('#count').textContent=isFr()?filtered.length+' sur '+heroes.length+' héros':filtered.length+' of '+heroes.length+' heroes';$('#empty').hidden=filtered.length!==0;$('#gallery').innerHTML=filtered.map(h=>'<button class="hero" data-slug="'+h.slug+'" aria-label="Open '+escapeHtml(h.name)+' profile"><img src="'+escapeHtml(h.img)+'" alt="'+escapeHtml(h.name)+' portrait" loading="lazy"><div class="meta"><span class="tag">'+escapeHtml([h.rarity,localizedFaction(h.faction)].filter(Boolean).join(' · '))+'</span><strong>'+escapeHtml(h.name)+'</strong><small>'+escapeHtml(h.role?localizedRole(h.role):(isFr()?'Voir le profil':'View profile'))+'</small></div></button>').join('');}
async function renderHeroDetail(h){if(isFr())await loadFrench(h);const content=isFr()?h.textFr:h.text;const err=isFr()?h.errorFr:h.error;$('#detail').innerHTML='<img src="'+escapeHtml(h.img)+'" alt="'+escapeHtml(h.name)+' portrait">'+(err?'<p>'+escapeHtml(err)+'</p>':markdown(publicProfile(content||'')));}
async function openHero(slug){const h=heroes.find(x=>x.slug===slug);if(!h)return;currentHeroSlug=slug;lastFocus=document.activeElement;$('#overlay').classList.add('open');$('#overlay').scrollTop=0;document.body.style.overflow='hidden';$('#detail').innerHTML='<p>'+(isFr()?'Chargement de ':'Loading ')+escapeHtml(h.name)+'…</p>';$('#close').focus();await load(h);await renderHeroDetail(h);}

function closeHero(){currentHeroSlug=null;$('#overlay').classList.remove('open');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus();}
$('#gallery').addEventListener('click',e=>{const b=e.target.closest('button[data-slug]');if(b)openHero(b.dataset.slug);});$('#close').addEventListener('click',closeHero);$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeHero();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHero();if(e.key==='Tab'&&$('#overlay').classList.contains('open')){const focusables=[...$('#overlay').querySelectorAll('button,a[href]')].filter(el=>el.getClientRects().length);if(!focusables.length)return;const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});['search','faction','rarity'].forEach(id=>$('#'+id).addEventListener('input',render));Promise.all(heroes.map(load)).then(render);render();

function applyHeroLanguage(){let l=document.documentElement.lang==='fr'?'fr':'en';document.querySelectorAll('[data-en][data-fr]').forEach(e=>e.textContent=e.dataset[l]);document.querySelectorAll('[data-set-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.setLanguage===l)));document.querySelector('#search').placeholder=l==='fr'?'Rechercher des héros…':'Search heroes…';render();if(currentHeroSlug){const h=heroes.find(x=>x.slug===currentHeroSlug);if(h)renderHeroDetail(h);}}
document.querySelectorAll('[data-set-language]').forEach(b=>b.addEventListener('click',()=>{try{localStorage.setItem('vxtr-language',b.dataset.setLanguage)}catch(e){}document.documentElement.lang=b.dataset.setLanguage;applyHeroLanguage()}));applyHeroLanguage();
</script></body></html>
